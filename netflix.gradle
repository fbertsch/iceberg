String scalaVersion = System.getProperty("scalaVersion") != null
        ? System.getProperty("scalaVersion")
        : System.getProperty("defaultScalaVersion")

subprojects {
    configurations {
        all {
            resolutionStrategy {
                eachDependency { DependencyResolveDetails details ->
                    if (details.requested.group.startsWith('com.fasterxml.jackson.')) {
                        def jacksonVersion = '2.13.+'
                        details.useVersion jacksonVersion
                        details.because "${project.name} is using useVersion to set this dependency version to ${jacksonVersion}"
                    }
                }
            }
        }
    }

    task javadocJar(type: Jar, dependsOn: javadoc) {
        archiveClassifier = 'javadoc'
        from javadoc.destinationDir
        group 'build'
    }

    task testJar(type: Jar) {
        archiveClassifier = 'tests'
        from sourceSets.test.output
        group 'build'
    }

    artifacts {
        archives javadocJar
        archives testJar
        testArtifacts testJar
    }

    // FIXME : Looks like we're excluding everything but spark, perhaps we
    //  could whitelist projects containing the '-spark' string instead of blacklisting everything else
    nebulaPublishing {
        skipArtifactory = scalaVersion == '2.12' && [
                'bdp-iceberg-client',
                // Skip the bdp-iceberg-spark parent artifact since it is non-spark specific version
                'bdp-iceberg-spark',
                'bdp-iceberg',
                'bdp-view',
                'iceberg-common',
                'iceberg-aliyun',
                'iceberg-core',
                'iceberg-bundled-guava',
                'iceberg-aws',
                'iceberg-api',
                'iceberg-dell',
                'iceberg-data',
                'iceberg-metacat',
                'iceberg-gcp',
                'iceberg-arrow',
                'iceberg-hive-metastore',
                'iceberg-nessie',
                'iceberg-pig',
                'iceberg-parquet',
                'iceberg-flink',
                'iceberg-flink-1.16',
                'iceberg-flink-runtime-1.16',
                'iceberg-orc',
                'iceberg-delta-lake',
                'iceberg-snowflake',
                'iceberg-azure',
                'iceberg-azure-bundle',
                'iceberg-gcp-bundle',
                'iceberg-aws-bundle'
        ].contains(project.name)
    }

    afterEvaluate {
        tasks.jar.dependsOn tasks.javadocJar
        tasks.jar.dependsOn tasks.testJar
        if (!['iceberg-flink', 'iceberg-spark','bdp-iceberg-spark'].contains(project.name)) {
            publishing {
                publications {
                    nebula(MavenPublication) {
                        artifact javadocJar
                        artifact testJar
                    }
                }
            }
        }
    }

    pluginManager.withPlugin('com.github.alisiikh.scalastyle') {
        scalastyle {
            config = file("${rootDir}/project/scalastyle_config.xml")
            inputEncoding = 'UTF-8'
            outputEncoding = 'UTF-8'
            failOnWarning = false
            verbose = false
            quiet = false
        }
    }
}